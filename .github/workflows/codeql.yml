name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analizar:
    name: Analizar JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
          # La carpeta con el código vulnerable "de reserva" no se escanea;
          # solo se detecta cuando lo copias a src/ en el PR de la demo.
          config: |
            paths-ignore:
              - demo-vulnerable

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
